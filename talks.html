---
layout: default
title: Talks
---
<h2>Talks</h2>

<ol class="publications-list" reversed>
    {% for talk in site.data.talks %}
        <li>
            <strong>{{ talk.title }}</strong>
            {% if talk.slides %}[<a href="/slides/{{ talk.slides }}.pdf">slides</a>]{% endif %}
            <br>
            {% if talk.url %}<a href="{{ talk.url }}">{{ talk.event }}</a>{% else %}{{ talk.event }}{% endif %} ({{ talk.place }}, {{ talk.date }})
        </li>
    {% endfor %}
</ol>
